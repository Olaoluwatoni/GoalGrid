<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Tracker{% endblock %}</title>
    <style>
        :root {
            --accent: #4f46e5;
            --bg: #f6f7fb;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
        }

        /* Menu */
        nav {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        nav a { color: var(--text); text-decoration: none; font-weight: 500; }
        nav a:hover { color: var(--accent); }
        nav span { margin-left: auto; color: var(--muted); }
        nav form { margin: 0; }

        /* Page container */
        main { max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
        main > p > a { color: var(--accent); }

        /* Buttons */
        button {
            font: inherit;
            padding: 0.35rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }
        button:hover { border-color: var(--accent); color: var(--accent); }
        main > form button {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        main > form button:hover { opacity: 0.9; color: #fff; }

        /* Forms */
        label { display: block; font-weight: 500; margin-bottom: 0.25rem; }
        input, select, textarea {
            font: inherit;
            padding: 0.45rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            width: 100%;
            max-width: 420px;
        }
        main > form p { margin: 1rem 0; }
        .helptext { color: var(--muted); font-size: 0.85rem; }
        .errorlist { color: #b91c1c; padding-left: 1.2rem; }

        /* Goals list */
        progress { width: 100%; height: 12px; accent-color: var(--accent); }
        main > ul { list-style: none; padding: 0; }
        main > ul > li {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.7rem 0.9rem;
            margin-bottom: 0.6rem;
        }
        main > ul > li small { color: var(--muted); }
        main > ul > li a {
            margin-left: auto;
            color: var(--accent);
            text-decoration: none;
        }
        main > ul > li form { margin: 0; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'index' %}">Home</a>
        {% if user.is_authenticated %}
            <a href="{% url 'goals' %}">My goals</a>
            <span>Hi, {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" style="display:inline">
                {% csrf_token %}
                <button type="submit">Log out</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Log in</a>
            <a href="{% url 'signup' %}">Sign up</a>
        {% endif %}
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
