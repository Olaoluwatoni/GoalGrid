{% extends 'tracker/base.html' %}

{% block title %}Edit goal{% endblock %}

{% block content %}
    <h1>Edit goal</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save changes</button>
    </form>
    <p><a href="{% url 'goals' %}">Cancel</a></p>
{% endblock %}
